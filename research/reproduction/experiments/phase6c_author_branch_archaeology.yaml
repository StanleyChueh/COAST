interpretation:
  case: "A (qualified) with D elements"
  statement: >
    The closest publicly available author-development pipeline, run under its native evaluation semantics
    (15 rollouts on the fitting init states 0-14), gives 12-13/15 for the KS3 global configuration, close to the
    reported 14/15 (=0.93). Same-state unsteered and random-conceptor runs give 10-12/15, so this value is not
    evidence of a steering gain. The released main implementation does not reproduce the reported KS3 result under
    our documented held-out protocol (Phases 5A/5C).

