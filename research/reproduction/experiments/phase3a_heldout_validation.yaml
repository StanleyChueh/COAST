conclusions:  # bounded to this held-out task/configuration
  q1_coast_improves_unseen_states: "Not demonstrated: 9 -> 11 (+2 -0, p 0.5); sign reversed vs dev (13 -> 11); shrinkage/random show the same held-out gains-only pattern; within baseline noise-seed spread (7-13)."
  q2_shrinkage_explains_coast: "Yes, as on dev: 14/15 agreement; hidden-state contraction identical to dev (0.8984 vs 0.9006); the one disagreement (41) is shared by random matched."
  q3_random_matched_like_real: "Largely: 13/15 (dev 15/15); disagreements symmetric (38 random+, 39 random-), real COAST sides with shrinkage in both; no direction-specific effect."
  mechanism_survives: true
  mechanism_statement: "At L5/beta=0.1, COAST acts as a state-independent ~10% contraction of h along h; shrinkage and a spectrum-matched random conceptor reproduce its behavior up to single-state divergences not specific to C_real. Across 30 states real COAST is never the sole outlier."
  not_concluded: ["COAST works (small, split-reversing success differences)", "COAST is useless (one task/configuration)"]

