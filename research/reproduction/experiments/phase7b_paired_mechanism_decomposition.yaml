  preregistered_case: C
  basis: "only one task (LR2a) meets the preregistered 'clear difference' rule for COAST vs SHRINKAGE, and its direction is NEGATIVE (COAST < SHRINKAGE); KS4 and LR1 not clear; Case B requires >= 2 clear positive tasks"
  caveats:
    - "the LR2a 'clear' call rests on the bootstrap criterion (CI [-0.250, -0.017]); per-repeat McNemar p = 0.55 / 0.125; no McNemar p < 0.05 in any repeat of any comparison"
    - "9 task x comparison cells tested; one CI excluding 0 at about the 5% level is compatible with chance"
    - "no task shows a positive conceptor-specific contribution; cross-task mean RD(COAST - SHRINKAGE) = -0.061 [-0.133, +0.006]"
  wording: "The contribution of the learned conceptor is task dependent (preregistered Case C); where a difference was detectable it was negative, and no task showed behavior beyond contraction in COAST's favor."
  phase_8: "per prereg Case C: geometry-aware / task-adaptive steering; any such method must beat PURE_SHRINKAGE at matched contraction on held-out states under paired noise (see report section 18)"

