# Phase 0 smoke test: unsteered pi0.5 baseline on LIBERO-10 task 0.
# This is an engineering smoke test only; the 3-episode success rate has no scientific meaning.

experiment_id: phase0_smoke_pi05_libero10_task00_seed0_3ep
timestamp: "2026-09-23T14:44:53+08:00"  # client start; client end 2026-09-23T14:45:29+08:00
paper: "Contrastive Conceptor Activation Steering (COAST): Unlocking Vision-Language-Action Models through Hidden States"
arxiv_id: "2605.17144"
git_commit: 2afa10ee256a3b3edfeb56500fea166a0837f119
branch: repro/arxiv-2605-17144
git_remotes:
  origin: https://github.com/StanleyChueh/COAST.git
  upstream: https://github.com/COAST-VLA/COAST.git

model: pi0.5
policy_config: pi05_libero
backend: pytorch  # --pytorch; auto-converted from the JAX checkpoint to bf16 model.safetensors
checkpoint: brandonyang/openpi-libero-2000
checkpoint_revision: aaeeabc72f8a50a8fa2d04544332c8ec1cd0142e
checkpoint_path: checkpoints/openpi-libero-2000
checkpoint_training_step: 2000

task_suite: libero_10
task_id: 0
task_name: LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket
task_language: "put both the alphabet soup and the tomato sauce in the basket"
num_episodes: 3
seed: 0  # env.seed(0), np.random.seed(0); episode k uses initial_states[(0 + k) % 50] -> init states 0, 1, 2
init_state_indices: [0, 1, 2]
max_steps: 520  # SUITE_MAX_STEPS["libero_10"], plus num_steps_wait=10
replan_steps: 5
resize_size: 224
steering: false
activation_collection: false

physical_gpu_id: 0
gpu_model: NVIDIA GeForce RTX 4090 (24564 MiB)
CUDA_VISIBLE_DEVICES: "0"

commands:
  policy_server: >-
    CUDA_VISIBLE_DEVICES=0 uv run --no-sync scripts/serve_policy.py --pytorch --port 8000
    policy:checkpoint --policy.config pi05_libero --policy.dir checkpoints/openpi-libero-2000
  policy_server_cwd: /home/stanley/Stanley_ws/COAST-research/COAST
  libero_client: >-
    CUDA_VISIBLE_DEVICES=0 MUJOCO_GL=egl
    LIBERO_CONFIG_PATH=/home/stanley/Stanley_ws/COAST-research/libero_config_coast
    uv run --no-sync python main.py --task_suite_name libero_10 --task_id 0
    --num_episodes 3 --seed 0 --port 8000 --output_dir output/phase0_smoke
  libero_client_cwd: /home/stanley/Stanley_ws/COAST-research/COAST/examples/libero_env
  note: "--no-sync only skips uv's pre-run re-sync of an already-synced venv; otherwise identical to the documented `uv run`."

baseline_successes: 3
baseline_failures: 0
success_rate: 1.0
per_episode:
  - {episode: 0, init_state: 0, success: true, video_frames: 286}
  - {episode: 1, init_state: 1, success: true, video_frames: 295}
  - {episode: 2, init_state: 2, success: true, video_frames: 321}
# video_frames = loop iterations incl. 10 settle steps (one frame per iteration, loop breaks on success)

runtime:
  client_wall_clock_s: 36.2  # all 3 episodes
  server_startup_s: ~90  # launch 14:43:25 -> listening; includes one-time JAX->PyTorch conversion
  root_uv_sync: 3h15m (network-bound)
  libero_uv_sync: 13m (second attempt)
  submodule_init: 30.6 min
  checkpoint_download: 18.7 min
  inference_latency_s: {first: 0.139, median: 0.124}  # post-run probe, one 10x7 action chunk per call

vram:
  gpu0_idle_mib: 18
  server_loaded_idle_mib: 7585
  peak_during_rollout_mib: 8596
  peak_gpu_util_pct: 68
  source: examples/libero_env/output/phase0_smoke/gpu0_vram.csv (nvidia-smi, 2 s sampling)

result_path: examples/libero_env/output/phase0_smoke/client.log  # main.py writes no results file for a single task; success is logged
result_line: "[libero_10/LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket/task_00] success_rate=1.00 (3/3)"
server_log: examples/libero_env/output/phase0_smoke/server.log
