    libero_version: {paper: not stated, ours: Robot-VLA/LIBERO d63b117, confidence: low, impact: low}
    split: {paper: 15 fit + 30 test; no IDs, ours: 'fit 0-14, test 15-44', confidence: low, impact: bounded, bound: best contiguous 30-window 22/30 (Phase 4A)}
    seeds: {paper: not given, ours: seed = init-state offset + env/np seed (post-PR48), confidence: low, impact: see split}
    pre_post_pr48: {paper: unknown, ours: post, confidence: low, impact: bounded, bound: window 0-29 COAST 19/30}
