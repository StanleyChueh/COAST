limitations:
  - "Single run: one task, one config, one conceptor (V0), one noise seed, development states only; V3 not instrumented."
  - "Measures only the direct change at the hooked layer; not propagation to later layers/actions, and not the counterfactual unsteered h."
  - "Token-mean summaries; Rayleigh quotient / effective scale are approximations from means."
  - "Success vs failure: n=15 (4 failures), many metrics, uncorrected p-values; whole-episode comparisons confounded by episode length."
  - "bf16 rounding of M quantified offline only; realized per-dimension beta not logged."
  - "One-step rollout-length difference at init state 25 vs Phase 1D not explained."
