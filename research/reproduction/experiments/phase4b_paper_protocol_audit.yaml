confidence:
  high: [model family and config, checkpoint name/step/repo, task identity, KS3 oracle config, layer indexing (0-based), hook site and gate formula, activation schema, fit N and split size, class counts 8/7, conceptor formula and precision]
  medium: [checkpoint weight identity, LIBERO/robosuite/MuJoCo versions, token pooling/centering/AND (paper differs from repo), success labeling, GPU/bf16 numerics, beta 0.2 off-grid, class threshold]
  low: [paper test states and seeds, whether Table 1 Base is the fit-set rate, code version behind paper numbers (pre or post PR48; which builder), libero_conceptors.npz (HTTP 401), selection procedure on fit rollouts, per-step implementation, controls on LIBERO, run count and noise seeding]

remaining_unknowns:
  - paper's 30 test init-state indices and seeds; whether they exclude the 15 fit states
  - code commit/branch behind Tables 1 and 4 (pre or post PR48; which conceptor builder)
  - whether Table 1 Base is the fit set or a separate paired 30-episode test run
  - how per-configuration success on the fit rollouts was measured (episodes, noise control)
  - per-step strategy implementation (alpha up to 10; N < d handling)
  - exact checkpoint weights and JAX-to-PyTorch conversion details
  - any shrinkage or random control on LIBERO
  - LIBERO/robosuite/MuJoCo versions and evaluation GPU

author_questions_draft:
  status: draft only; nothing sent
  questions:
    - "Which LIBERO init-state indices and seeds were used for the 30 held-out test rollouts per task, and do they exclude the 15 fitting states (were fit rollouts init states 0-14, --seed 0)?"
    - "Were the LIBERO experiments run before or after PR48 (2026-04-23, --seed began selecting init states)? Which commit or branch produced Tables 1 and 4?"
    - "In Table 1 the LIBERO pi0.5 'Base' equals the Table 21 fit-set rates for all 10 tasks. Is Base the 15 fit rollouts, or a separate 30-episode unsteered test run on the same states as the steered runs?"
    - "How was 'success on the fitting rollouts' obtained for each of the 240 configurations (steered runs on the 15 fit states? episodes per config? noise control?) and was the selected config re-evaluated on the test states exactly once?"
    - "Were the reported conceptors built with the released token-flattened uncentered builder or the mean-pooled centered pinv pipeline of App. A.9.1? Is brandonyang/libero-conceptors public (anonymous access returns HTTP 401)?"
    - "The repository fixes per-step alpha at 1.0, but Table 4 lists per-step alpha 10.0 (KS3). Which code produced these, and how is the per-step covariance handled when N < d?"
    - "Is brandonyang/openpi-libero-2000 revision aaeeabc72f8a (2026-04-09) the exact weights behind the reported results?"
    - "Was a random-eigenvector or a uniform-shrinkage (M=(1-beta)I) control run on LIBERO? Does the reported gain survive a shrinkage control?"
    - "Are Table 1/4 cells single runs? Was policy sampling noise seeded?"
    - "Which LIBERO/robosuite/MuJoCo versions and which GPU were used for the evaluation rollouts?"

recommendation:
  primary: contact authors (questions 1-5 first)
  parallel_offline_options_not_done:
    - rebuild V0/V3 conceptors from the authors' public KS3 fit activations and compare with ours (Phase 1B style)
    - compute paper diagnostics (quota, overlap; Tables 18/19) on those activations
  do_not_yet: begin an improvement method (the paper's evaluation protocol, and so the claim to improve on, is not pinned down)
  fallback_if_no_reply: >-
    V3 and random-matched controls at beta 0.2-0.3 on states 15-44, plus per-step steering, after the missing choices are documented and preregistered

limits:
  - paper read from arXiv v1 HTML (tables flattened); key numbers cross-checked programmatically; figures not viewed
  - Base-column identity is a numerical observation, not a stated protocol
  - pre-PR48 effect on the paper is a possibility, not a finding
  - Fisher tests compare different state sets; reference only
  - other upstream branches only listed; released activation dataset only sampled (30 metadata.json files)

outputs:
  - research/reproduction/phase4b_paper_protocol_audit.md
  - research/reproduction/experiments/phase4b_paper_protocol_audit.yaml
