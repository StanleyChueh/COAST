paper_vs_code_conclusions:
  - "Repository-faithful and paper-faithful C_contrastive are materially different: 58-100% relFro (global), top-10 eigenspace alignment 0.07-0.67."
  - "D1 pooling dominates; D2 centering mostly cancels in C_contrastive; D3 AND is a smaller magnitude change but determines symmetry/PSD."
  - "Repository-AND C_contrastive is non-symmetric; the runtime hook uses h @ M.T without symmetrization."
  - "Paper-faithful global conceptors are well-posed; paper-faithful per-step conceptors are ill-posed with 15 episodes after pooling (N < d). This must be resolved before per-step steering."
  - "Single-task diagnostics are closer to paper Tables 18/19 trends for V3 than for V0 (quota layer ordering; small-alpha overlaps), but one task is not conclusive."
  - "Phase 1A D6 corrected: paper threshold 3 vs repository default min_episodes_per_class=2."
