# Phase 5C: KS3 paper-style oracle selection reproduction (see ../phase5c_ks3_oracle_sweep.md)
experiment_id: phase5c_ks3_oracle_sweep
status: complete
date: '2026-09-25'
paper: Contrastive Conceptor Activation Steering (COAST), arXiv:2605.17144 v1
question: With the paper's oracle selection procedure (15 fit rollouts -> grid -> per-strategy best -> 30 test rollouts), does the released implementation reproduce KS3 Table 4?
answer: 'No in this run: global 21/30 (paper 28), positive_only 17/30 (paper 24), per_step alpha=1.0 15/30 (paper 26 at alpha 10); unsteered test baseline 17/30;
  no selected config distinguishable from baseline. Measured gap under one protocol interpretation, not a statement that COAST fails.'
interpretation_case: 'case 3 (baseline-like) for positive_only and per_step; global between case 2 and case 3 (+4 vs same-run baseline, +2 vs Phase 5A fixed config,
  within our unsteered run-to-run range 17-21/30)'
repository: {branch: exp/ks3-oracle-sweep, commit: e84c39932a18cc183279466b38766a898d6f831a, code_changes_to_src_scripts_examples_experiments: none}
model: {policy: pi0.5 pi05_libero (PyTorch), checkpoint: checkpoints/openpi-libero-2000, hf_repo: brandonyang/openpi-libero-2000}
task: {suite: libero_10, task_id: 2, name: KITCHEN_SCENE3_turn_on_the_stove_and_put_the_moka_pot_on_it, paper_label: KS3, max_steps: 520, replan_steps: 5}
conceptor:
  label: 'RELEASED implementation (V0: token-flattened, uncentered, repository Boolean AND); not the paper-mathematics builder V3'
