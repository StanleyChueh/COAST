limitations:
  - "Small N: 15 episodes per condition, one master noise seed, one run each, one random basis (seed 1466119911)."
  - "Single task, single layer (5), single beta (0.1), single alpha (0.5), single conceptor (V0), development split."
  - "Not magnitude-matched: realized contraction 10.16% / 9.94% / 9.78% (B/C/D) from bf16 diagonal rounding and differing Rayleigh quotients; not corrected (would require tuning)."
  - "C_random matches sym(C_real); C_real's 4.2% skew part not reproduced (contributes nothing along h)."
  - "Steered-path rollout-length jitter across processes (up to 30 steps) limits interpretation of single-state length differences."
  - "Mechanism measured only at the hooked layer."
