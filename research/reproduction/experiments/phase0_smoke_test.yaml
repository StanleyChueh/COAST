deviations_from_docs:
  - "LIBERO config written to an isolated LIBERO_CONFIG_PATH (same content as setup_libero_config.py) instead of ~/.libero, to avoid affecting ~/Stanley_ws/lerobot."
  - "Only params/ + assets/ + _CHECKPOINT_METADATA downloaded (train_state/ skipped, ~32 GB, not used for inference)."
  - "Server run with --pytorch: the backend used by the COAST pipeline baseline (run_end_to_end.sh stage g1) and all pi0.5 steering. The README's plain single-task serve example uses JAX by default."

problems_and_fixes:
  - problem: "uv not installed"
    fix: "installed uv 0.12.18 via official Astral installer to ~/.local/bin"
  - problem: "libero uv sync: 'Failed to acquire lock on the distribution cache' (openpi-client editable)"
    cause: "ran concurrently with root uv sync (self-inflicted)"
    fix: "re-ran identical command after root sync finished"
  - problem: "hf download fetched only assets/ (multi-value --include parsed as filenames)"
    fix: "repeated --include flags"
  - problem: "serve_policy --pytorch first run: ValueError Unrecognized configuration class GemmaConfig for AutoModel"
    cause: "first-run transformers auto-patch purges gemma modules from sys.modules -> GemmaConfig class identity mismatch with AutoModel registry"
    fix: "re-ran identical command (patch already on disk -> no purge). No code change. Repository bug worth reporting upstream."

paper_vs_code_differences:
  - topic: held-out test rollout count
    paper: "30 held-out test rollouts per task per condition (Sec. 4.1, App. A.8.3, Tables 4-7)"
    code: "run_end_to_end.sh final eval (g) uses NUM_EPISODES=15; README 'per-task tuned configs' example uses --num_episodes 10"
    difference: "15 (or 10) vs 30 test episodes"
    possible_consequence: "wider CIs; reported SR granularity differs (e.g. paper values are multiples of 1/30)"
  - topic: data used for hyperparameter selection
    paper: "15 fitting rollouts used both to construct conceptors and select hyperparameters (Sec. 4.1, A.8.5)"
    code: "collection at seed 0 (15 eps); sweep at a separate seed 15 window (15 eps; find_best_configs default 10 eps, seed 7); eval at seed 30"
    difference: "code uses a third, disjoint rollout set for selection"
    possible_consequence: "different selection noise and possibly different chosen configs; code is stricter"
  - topic: disjointness of initial conditions
    paper: "test rollouts use entirely unseen environment configurations; no seeds shared with fitting set; env reset with sequential episode seeds (A.8.3, A.8.5)"
    code: "main.py: env.seed(seed) once per run; episode k uses initial_states[(seed + k) % 50]; LIBERO has only 50 canonical init states per task"
    difference: "with seeds 0/15/30 and 30 test episodes, eval states 30..49,0..9 would overlap collection states 0..9 (wrap-around). With 15 eval eps (current script) there is no overlap."
    possible_consequence: "test/fit leakage if the paper's 30-episode protocol is run with the script's seeds; at most 50 distinct init states means 15+15+30 cannot be fully disjoint"
  - topic: hyperparameter grid
    paper: "Table 4 (pi0.5 LIBERO-10): layers {5, 11}; selected alpha values include 2.0 and 10.0; beta includes 0.5"
    code: "find_best_configs.py defaults: layers (11,), alphas (0.1, 0.5, 1.0), betas (0.1, 0.3); per_step alpha fixed at 1.0 sentinel"
    difference: "default code grid cannot produce several Table 4 configurations (L5, alpha=2.0/10.0, beta=0.5, per_step with alpha != 1.0)"
    possible_consequence: "default sweep may not reproduce Table 4 numbers"
  - topic: success labeling
    paper: "labeled successful if the final step's info['is_success'] is True (A.8.3)"
    code: "rollout terminates at the first done=True and records success=True"
    difference: "early termination on first success vs final-step flag"
    possible_consequence: "likely equivalent in practice; minor if a success could later be undone"
  - topic: task naming in Table 4
    paper: "abbreviations such as 'LR2' are used for two different tasks (alphabet soup + tomato sauce; cream cheese + butter)"
    code: "libero_10 task 0 = LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket"
    difference: "ambiguous paper labels"
    possible_consequence: "per-task comparisons need mapping by full task description, not abbreviation"
  - topic: inference backend
    paper: "not specified"
    code: "pi0.5 steering and pipeline baseline use PyTorch, auto-converted from the JAX checkpoint (bf16)"
    difference: "unspecified in paper"
    possible_consequence: "JAX vs PyTorch numerics may shift baseline SR slightly; keep backend fixed across baseline/steered runs"
  - topic: training setup (informational)
    paper: "App. A.11.2: batch 256 across 4 FSDP devices"
    code: "pi05_libero config: batch_size=256, fsdp_devices=1"
    difference: "FSDP device count"
    possible_consequence: "none for inference with the released checkpoint"

notes:
  - "3/3 success on init states 0-2 is NOT a scientific result; the paper reports 20-60% baseline SR across LIBERO-10 for this checkpoint, and 3 episodes are far too few to estimate that."
  - "Init states 0-2 fall inside the pipeline's collection window (seed 0); do not reuse this run as held-out evaluation data."
  - "One server traceback ('Prompt is required') appears in server.log after the rollout. It came from a deliberate post-run probe sending a request without a prompt."
  - "Stop condition respected: no activation collection, conceptors, steering, sweeps, full-suite eval, or training was run."
