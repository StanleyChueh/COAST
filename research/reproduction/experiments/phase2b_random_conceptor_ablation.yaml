interpretation:  # bounded to this configuration
  outcome_case: "Case 2: real COAST ~= random matched ~= shrinkage"
  points:
    - "Random matched (same spectrum, random eigenvectors) reproduced all 15 real-COAST episode outcomes, including COAST's only non-shrinkage outcome (state 21)."
    - "No detectable behavioral contribution of the conceptor direction; the state-21 COAST-vs-shrinkage difference is not direction-specific (magnitude or generic spectrum-level term; not separable here)."
    - "Mechanism: all three interventions are ~10% contraction along h (cos -0.9985..-0.9999; contraction 9.78-10.16%). C_real's Rayleigh quotient on real layer-5 states (0.006) is below a random rotation's (0.017): h lies mostly in C_real's low-eigenvalue subspace."
    - "Does not show conceptor directions are useless in general: weak C (lambda_max 0.35), small beta, one layer/task/seed/random basis."
    - "All counts (13/10/11/11) within baseline noise-seed spread (7-13) from Phase 1D; no pairwise difference statistically distinguishable at N=15."

