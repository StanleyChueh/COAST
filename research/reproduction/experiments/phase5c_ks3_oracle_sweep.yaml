    --num_episodes 15 --seed 0 --betas 0.1 0.3 0.5 --port <port> --output_dir examples/libero_env/output/phase5c_sweep_<name> --best_configs_path examples/libero_env/output/phase5c_sweep_<name>/best_configs.json
    --strategies <s> --layers <layers> --alphas <alphas>'
