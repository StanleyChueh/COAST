  paper:
    id: arXiv:2605.17144
    title: "Contrastive Conceptor Activation Steering (COAST): Unlocking Vision-Language-Action Models through Hidden States"
    version: v1
    submitted: 2026-05-16
    read: full HTML text (main paper, Appendices A and B, checklist); figures not viewed
  released_code:
