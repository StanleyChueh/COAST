random_matched_construction:
  implementation: "existing upstream strategy (commit 6c34a11), reused unchanged: openpi.serving.conceptors.random_matched_conceptor via steering.get_conceptor_matrix"
  steps:
    - "C_sym = (C_real + C_real^T) / 2  (float64)"
    - "Lambda = eigvalsh(C_sym)"
    - "Q, R = np.linalg.qr(np.random.default_rng(seed).standard_normal((d, d)))"
    - "C_random = Q diag(Lambda) Q^T -> float32"
  seed: 1466119911
  seed_derivation: "blake2b(repr((task, layer=5, alpha=0.5, 'random_matched')), digest_size=4); beta-independent; process-stable"
  seed_logged_by_server: "random_matched: seed=1466119911 from seed_key=('KITCHEN_SCENE3_...', 5, 0.5, 'random_matched')"
  dimension: 1024
  qr_sign_fix: "not applied in code; provably a no-op for C_random (column signs cancel in Q L Q^T); verified: sign-fixed C bit-identical to production (max |diff| = 0.0; 537/1024 negative diag(R))"

