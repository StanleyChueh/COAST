  preregistered_case: A   # G_H > G_T in 2/3 tasks (LR2a, LR1) and COAST not clearly better than baseline/random in Arm T in 3/3
  caveat: "protocol-gap component weak and inconsistent (PGG +0.03, -0.15, +0.13; mean +0.006); the robust part is the absence of a held-out advantage over the matched random control (pooled 109/180 vs 109/180)"
