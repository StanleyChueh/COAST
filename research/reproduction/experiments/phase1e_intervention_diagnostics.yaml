interpretation:  # descriptive; no causal claims
  - "At L5 with beta=0.1, V0 global steering is ~a uniform shrink h' ~= 0.90 h (cos(delta,h) = -0.9996); the extra 0.1*C*h term projects onto h at ~0.06% of ||h|| and is bounded by 0.1*lambda_max = 3.5% of ||h||."
  - "Absolute intervention size is set by ||h||: largest at denoising step 0, smallest at step 9; nearly flat over rollout time and across episodes."
  - "Hypothesis (not tested): if V3 also has h'Ch/||h||^2 << 1 on visited states, V0 and V3 both reduce to ~(1-beta)h, consistent with their identical Phase 1D success vectors. V3 not measured."
  - "A uniform shrink of the pre-norm residual stream is not a no-op: it reweights layers 0-5 against later layers' additions."

