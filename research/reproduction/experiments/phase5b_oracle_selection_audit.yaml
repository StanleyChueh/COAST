  wall_clock_1gpu_h: ~11-12
  storage_gb: ~2.5 (videos, gitignored); NPZ already present (755 MB)
  verdict: affordable; staging recommended for decision gates, not for cost

recommended_plan:
  stage0_preparation: [preregistration (states, grid, NPZ sha256, tie rule, reading rule), pre-flight NPZ/key/test checks, write analysis tool T1]
  stage1: {task: KS3, strategy: global, sweep_states: 0-14 (--seed 0 --num_episodes 15), shards: 'GPU0 layers 0,5; GPU1 layers 11,17', gate: record tie set and whether L5/a0.5/b0.1 is in it; proceed regardless}
  stage2: {invocations: [positive_only (GPU0), per_step alpha=1.0 (GPU1), linear optional (GPU1)], mixing: never, selections_frozen_before_test: true}
  stage3: {server: serve_policy.py --pytorch --steer, test_states: 15-44 (--seed 15 --num_episodes 30), rerun_even_if_same_as_phase5a: true}
  tie_rule: highest fit success; ties -> first in (layer asc, alpha asc, beta asc); full tie set reported; no tie-break reruns; no test data in selection
  reading_rule: per strategy vs paper Table 4 (global 28/30, per-step 26/30, positive-only 24/30); consistent if inside paper Wilson 95%; inconsistent if Fisher p<0.05; else inconclusive; report fit-to-test drop
  not_recommended_now: [all 10 tasks, seeded/paired noise, V3 builder arm, authors-activation arm, shrinkage/random controls]

decisions_needed:
  E1_sweep_states: {default: 'fit states 0-14 (--seed 0)', reason: literal paper reading; README --seed 15 overlaps test states 15-44}
  E2_test_states: {default: '15-44 (--seed 15 --num_episodes 30)'}
  E3_per_step_alpha_C1: {default: not now; run alpha=1.0; decide after stage 2}
  E4_include_linear: {default: include}
  E5_tie_rule: {default: first-in-order + tie sets}
  E6_gpus: {default: both RTX 4090, one sweep process each}

faithful_reproduction_possible:
  procedure: yes
  global: yes (exact grid)
  positive_only: yes (exact grid)
  per_step: partial without C1; yes with C1
  linear: equivalent (assumes same h + alpha*v form)
  identical_to_authors_run: not verifiable
  unresolvable_items: [paper fit/test state IDs and seeds, code version pre/post PR48, builder V0 vs V3 behind paper numbers, tie rule, policy noise, number of runs per cell, checkpoint weight identity]
coast_fails_conclusion: not drawn
