video_paths:
  - examples/libero_env/output/phase0_smoke/00-living-room-scene2-put-both-the-alphabet-soup-and-the-tomato-sauce-in-the-basket/episode_000.mp4
  - examples/libero_env/output/phase0_smoke/00-living-room-scene2-put-both-the-alphabet-soup-and-the-tomato-sauce-in-the-basket/episode_001.mp4
  - examples/libero_env/output/phase0_smoke/00-living-room-scene2-put-both-the-alphabet-soup-and-the-tomato-sauce-in-the-basket/episode_002.mp4
