interpretation_limitations:
  - "Development-split pilot: N=15 per condition, one task, one configuration, one run each; no tuning; states 30-44 untouched."
  - "Initial states are paired, but policy noise is not; this is not a strictly paired causal comparison."
  - "Episode-level churn (baseline vs steered disagree on 10/15 states; repo vs paper on 6/15; no state failed in all three) is large relative to the +2 differences; the results are compatible with sampling noise."
  - "No evidence either that COAST (V0 or V3) improves on the baseline or that V0 and V3 differ behaviorally at this setting, and none against it."
  - "A noise-floor estimate (repeated baseline runs) or controlled policy noise is needed before stronger claims."
  - "Not comparable to paper Table 4 (0.93 on 30 held-out rollouts with the paper's own conceptors)."
