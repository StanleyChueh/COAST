  keys: 184
  key_layout: 4 layers x 5 alphas x {C_success, C_failure, C_contrastive}; per-step 0-9 per layer (alpha 1.0); 4 linear directions
  built_from: fit states 0-14 (8 success / 7 failure), Phase 5A, experiments/libero/compute_conceptors.py defaults
  committed: false
fit_split: {episodes: 15, seed: 0, init_states: 0-14, use: conceptor construction and oracle selection}
test_split: {episodes: 30, seed: 15, init_states: 15-44, use: evaluation only after freeze, fresh_to_researcher: false}
noise: {noise_control: false, policy_noise_seed: null, diagnostics: false, paired_between_conditions: false}
