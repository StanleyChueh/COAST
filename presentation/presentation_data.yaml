  subtitle: "From Reproduction Gap to Mechanistic Diagnosis"
  scope: "π0.5 · LIBERO-10 · KS3 and Cross-Task Validation"
  author: "Stanley Chueh"
  date: "2026-09-25"
  latest_phase: "7A"
  latest_phase_title: "Cross-Task Protocol Validation"
  paper_ref: "arXiv:2605.17144 v1 — Contrastive Conceptor Activation Steering (COAST)"
  paper_authors: "Miao, Kim, Yang, Ungar"
  output_file: "COAST_Reproduction_Status.pptx"
  footer: "COAST reproduction study · updated through Phase 7A"

# ---------------------------------------------------------------- paper values
