validation:
  checkpoint_loads: true  # params restored (12.5 GiB), converted, norm stats loaded from checkpoint assets
  policy_server_starts: true  # "server listening on 0.0.0.0:8000" (second attempt)
  libero_simulator_starts: true
  camera_observations_produced: true  # agentview + wrist 256x256 uint8 -> 224x224 policy inputs
  language_instruction_reaches_policy: true  # probe: request without prompt -> server "ValueError: Prompt is required"; with prompt -> actions
  actions_returned: true  # shape (10, 7), range [-0.987, 0.055] in probe
  robot_moves: true  # probe: EEF moved 0.019 m in 30 policy steps; all 3 episodes reached task success
  all_episodes_executed: true
  success_recorded: true
  result_files_written: true  # client.log; no JSON by design of main.py
  videos_written: true
  nan_or_inf: none_observed  # probe asserted np.isfinite on 6 chunks; no nan/inf in client or server logs
  hidden_runtime_errors: none  # only expected warnings (robosuite macros, gym deprecation, LIBERO datasets path, jax rocm/tpu backends)
  gpu_memory_reasonable: true  # 8.6 GiB peak of 24 GiB

