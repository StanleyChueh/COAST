noise_control:
  mechanism: >-
    Client attaches obs["__noise_control__"] = {master_seed, task_id, init_state, rollout_step}.
    Server (--noise-control) installs NoiseControlledPolicyWrapper as the outermost wrapper; it pops the key,
    derives the noise, calls inner.infer(clean_obs, noise=noise), and echoes {sha256, shape, key} under
    response["noise_control"]. Policy.infer / Policy.infer_with_steering convert it identically and pass it as
    noise= to sample_actions / sample_actions_with_steering (replacing the sample_noise() draw only).
  key_fields_in_order: [master_seed, task_id, init_state, rollout_step]
  construction: "numpy.random.Generator(PCG64(SeedSequence([master_seed, task_id, init_state, rollout_step]))).standard_normal((10, 32), dtype=float32)"
  fingerprint: "sha256 of little-endian float32 bytes, C order"
  distribution: "i.i.d. N(0,1) float32 (same as PI0Pytorch.sample_noise; different generator)"
  shape: [10, 32]  # (action_horizon, action_dim) read from loaded PI0Pytorch.config, cross-checked vs pi05_libero train config
  sampler_tensor: "(1, 10, 32) float32 on cuda:0"
  rollout_coordinate: "rollout_step = post-settle step at which a new chunk is requested (0, 5, 10, ...)"
  master_seed_three_way: 100  # preregistered before any rollout
  master_seeds_noise_floor: [100, 200, 300]
  golden_fingerprint_100_2_15_0: 87ae314ae03d4e549d3bfa442c28cb94f594bff03d5c196422ae8b165ab113a0
  numpy_version: "1.26.4"
  global_torch_reseeding: none
  backward_compatible: "wrapper only installed with --noise-control; requests without the key pass through unchanged; client requires server metadata noise_control_enabled and a matching echo on every response"

code_changes:
  modified:
    src/openpi/policies/policy.py: "infer_with_steering(..., noise=None) -> converts like infer() and passes noise= to sample_actions_with_steering"
    src/openpi/serving/steering.py: "SteeredPolicyWrapper.infer(obs, *, noise=None) forwards noise only when set; pi0-fast + noise -> NotImplementedError"
    scripts/serve_policy.py: "--noise-control flag; rejects pi0-fast and --collect_activations; shape from loaded model vs train config; outermost wrapper"
    examples/libero_env/main.py: "--policy_noise_seed; metadata check; payload per request; echo check; noise_fingerprints.jsonl"
