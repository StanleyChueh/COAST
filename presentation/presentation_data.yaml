  libero10_mean: {base: "0.43", global: "0.76", per_step: "0.80", pos_only: "0.63"}
  protocol_text: "15 fitting rollouts (conceptors + selection) → 30 held-out test rollouts per condition"
  grid_table14: "layer {0,5,11,17} × α {0.1,0.5,1,2,10} × β {0.1,0.3,0.5} × 4 strategies = 240"
