    task: "KS3 — KITCHEN_SCENE3: turn on the stove and put the moka pot on it (libero_10 task 2)"
    base:     {value: "0.53", count15: "8/15", note: "= Table 21 fit-set rate (8 S / 7 F)"}
    global:   {value: "0.93", config: "L5 · α 0.5 · β 0.1", count30: "28/30", count15: "14/15"}
    per_step: {value: "0.87", config: "L5 · α 10 · β 0.3",  count30: "26/30", count15: "13/15"}
