# Phase 6A: reproduction-gap analysis (analysis only; see ../phase6a_reproduction_gap_analysis.md)
experiment_id: phase6a_reproduction_gap_analysis
status: complete
date: '2026-09-25'
paper: Contrastive Conceptor Activation Steering (COAST), arXiv:2605.17144 v1
question: Why does our KS3 reproduction not match the paper; is the gap due to (A) missing reproduction details, (B) released-implementation differences, or (C) a
  method limitation?
repository: {branch: exp/reproduction-gap-analysis, commit: 978de727b4ae1708fb8dc05286f897569dcbff80, upstream_base: 2afa10ee256a3b3edfeb56500fea166a0837f119,
  code_changes: none, experiments_run: none}
verdict:
  status: reproduction gap observed
  not_claimed: [COAST fails, paper numbers are wrong]
  ruled_out_by_measurement: [fixed configuration (oracle 21/30 vs fixed 19/30), missing oracle selection (run with released tool, Phase 5C)]
  bounded_unlikely_alone: [test-state window, V0 vs V3 builder, checkpoint identity, single-run policy noise, software versions]
  leading_unbounded: [how the Table 4 oracle number was produced (fresh test vs best-of-grid on reporting rollouts; runs per cell), code version behind Table 4
      (per-step alpha 10 absent from release)]
  method_limitation_C: hypothesis supported in our setup (COAST ~ 0.9*h shrink ~ random matched ~ baseline on KS3), not a conclusion; one task, one checkpoint;
    cannot be separated from A until the paper protocol is known
measured_summary:
  paper_table4_ks3: {global: 28/30, per_step: 26/30 (alpha 10), positive_only: 24/30, base_table1: 0.53}
  ours_global_on_states_15_44: {phase4a_fixed: 20/30, phase5a_fixed: 19/30, phase5c_oracle: 21/30, pooled: 60/90, fisher_pooled_vs_28_of_30: 0.0038}
  ours_unsteered_on_states_15_44: {phase4a: 21/30, phase5a: 19/30, phase5c: 17/30, pooled: 57/90, fisher_steered_vs_unsteered_pooled: 0.755}
  ours_phase5c_other: {positive_only_L0_a2_b0.3: 17/30, per_step_L5_a1_b0.3: 15/30}
  ours_unsteered_fit_states_0_14: {phase1a: 8/15, phase5c_pooled_fit_baselines: 36/75}
history:
- {phase: 1B, result: V0 vs V3 conceptors differ 53-123% rel. Frobenius; L5 a0.5 quota V0 0.0185 V3 0.0103, meaning: builders differ numerically}
- {phase: 1D, result: 'paired noise: baseline 13, V0 11, V3 11 of 15; V0=V3 on 15/15; noise seed alone 7-13/15', meaning: builder difference has no behavioural
    effect at paper config; noise dominates N=15}
- {phase: 1E, result: 'cos(dh,h)=-0.9996, |dh|/|h|=0.0994', meaning: COAST ~ uniform 0.9*h shrink at paper config}
- {phase: 2A, result: COAST 11 vs shrinkage 10 of 15; same outcome 14/15, meaning: shrinkage reproduces COAST}
- {phase: 2B, result: COAST 11 vs random matched 11 of 15; same outcome 15/15, meaning: conceptor direction not behaviourally relevant here}
- {phase: 3A, result: 'held-out 30-44: baseline 9, shrink 10, COAST 11, random 11 of 15', meaning: no demonstrable gain}
- {phase: 4A, result: 'all 50: baseline 30, COAST 32, shrink 31; 15-44: baseline 21, COAST 20', meaning: COAST ~ baseline ~ shrinkage}
- {phase: 4B, result: model/checkpoint/config/hook match; states, seeds, code version, Base definition, builder unknown, meaning: evaluation protocol unverifiable}
- {phase: 5A, result: 'fixed L5 a0.5 b0.1: COAST 19/30, baseline 19/30 (paper 28/30, p=0.010)', meaning: reproduction gap observed}
- {phase: 5B, result: oracle procedure runnable with CLI flags; per-step alpha only 1.0, meaning: feasible except per-step alpha}
- {phase: 5C, result: 'oracle: global 21, positive_only 17, per_step 15, baseline 17 (of 30)', meaning: gap persists under oracle selection}
