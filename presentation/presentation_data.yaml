# COAST reproduction deck — content source of truth.
#
# Layout lives in build_slides.js; this file holds the science.
#   * Measured values are NOT typed here. Use {{d.<path>}} placeholders, which
#     build_slides.js resolves from generated_figures/chart_data.json (written by
#     extract_data.py from research/reproduction/experiments/). An unknown
#     placeholder aborts the build.
#   * Paper-reported values live under `paper:` and are referenced as {{p.<path>}}.
#   * {{m.<key>}} reads `meta:`.
# Inline markup: **bold**, ^{sup}, _{sub}, <o>paper-orange</o>, <c>ours-cyan</c>,
#   <g>match-green</g>, <r>discrepancy-red</r>, <y>unresolved-yellow</y>, <m>muted</m>.

