    torch_jax: {ours: torch 2.7.1+cu126, jax 0.5.3, transformers 4.53.2}
    hardware: {paper: B200 (latency), ours: RTX 4090, impact: low}
new_calculations:
  window_scan:
    source: research/reproduction/experiments/phase4a_episode_results.csv (KS3, 50 states, one paired-noise run)
    windows: contiguous 30-state, cyclic mod 50
    baseline: {all50: 30, win_0_29: 21, win_15_44: 21, best: 22, worst: 13, n_ge_28: 0}
    coast_L5_a0.5_b0.1: {all50: 32, win_0_29: 19, win_15_44: 20, best: 22, worst: 16, n_ge_28: 0}
    coast_b0.3: {all50: 27, win_0_29: 14, win_15_44: 16, best: 19, worst: 13, n_ge_28: 0}
    shrink_b0.1: {all50: 31, win_0_29: 17, win_15_44: 21, best: 22, worst: 16, n_ge_28: 0}
    caveat: single noise realisation; bounds the expected window rate, not every draw
  order_statistic:
    model: max of m iid Binomial(30, p) (independence overstates m)
    p_0.63: {m1: [18.9, 0.000], m12: [23.1, 0.002], m60: [24.7, 0.010], m240: [25.8, 0.038]}
    p_0.67: {m1: [20.1, 0.001], m12: [24.1, 0.009], m60: [25.7, 0.043], m240: [26.7, 0.162]}
    p_0.70: {m1: [21.0, 0.002], m12: [24.9, 0.025], m60: [26.4, 0.119], m240: [27.4, 0.398]}
    columns: [expected_max, P(max>=28)]
    reading: a single fresh test at our measured rate cannot plausibly give 28/30; best-of-grid on the reporting rollouts can (compatibility, not evidence)
unknowns_ranked:
- {rank: 1, unknown: how the Table 4 oracle number was produced (fresh test vs best-of-grid on reporting rollouts; runs per cell), explains_gap: fully compatible,
  bound: none, category: A}
- {rank: 2, unknown: code version / pipeline behind Table 4, explains_gap: possibly, bound: 'partial (V0=V3, V3~shrink offline); unreleased code unseen', category: B}
- {rank: 3, unknown: policy noise seeding and repeated runs, explains_gap: only with rank 1 or best-of-k, bound: 'single run P=0.0007; best of 12 P~0.009', category: A}
- {rank: 4, unknown: test state IDs and seeds, explains_gap: unlikely alone, bound: best contiguous window 22/30, category: A}
- {rank: 5, unknown: V0 vs V3 builder, explains_gap: unlikely at tested config, bound: identical 15/15 paired outcomes, category: B}
- {rank: 6, unknown: exact checkpoint weights, explains_gap: unlikely, bound: fit rate equals paper Base, category: B}
- {rank: 7, unknown: Base definition, explains_gap: no for steered 28/30; yes for claimed gain, category: A}
- {rank: 8, unknown: LIBERO/robosuite/MuJoCo versions, explains_gap: unlikely, bound: base rate matches, category: A}
- {rank: null, unknown: per-step alpha 10, explains_gap: per-step column only, bound: confirmed difference, category: B}
author_questions_draft_not_sent:
- Is Table 4 KS3 28/30 one fit-selected config tested once on 30 separate rollouts, or best-of-grid on the reported rollouts? How many runs per cell?
- Which init-state indices and seeds for the 15 fit and 30 test rollouts? Pre- or post-PR #48?
- Which commit/branch produced Tables 1 and 4? How was per-step alpha 10 produced when the release fixes it at 1.0?
- Released V0 builder or App. A.9.1 pipeline? Can brandonyang/libero-conceptors be made public (HTTP 401)?
- Exact checkpoint revision/hash and PyTorch conversion path?
- Was flow-matching sampling noise seeded, and how?
- Is Table 1 Base the 15 fit rollouts or a separate unsteered test run?
- LIBERO, robosuite, MuJoCo versions?
recommendation:
  option: B (contact authors; questions prepared, not sent)
  why: all self-testable explanations are measured or bounded; leading explanations (ranks 1-2) answerable only by the authors
  evidence: [5A and 5C gaps (p=0.010, 0.042; pooled 0.004), Phase 4A window scan max 22/30, Phase 1D V0=V3, fit rate equals paper Base, order-statistic compatibility
      of best-of-grid reporting]
  remaining_uncertainty: [one task and one checkpoint, single unpaired test runs (SD ~0.09), states 15-44 reused across phases, rank 1 is a compatibility argument not
      a finding, unreleased code may differ]
  not_recommended: {A: remaining self-testable items already bounded; per-step alpha needs source change for one column, C: target claim not pinned to a protocol;
      effect indistinguishable from zero and from shrinkage in our setup}
  optional_parallel_offline: Phase 4B 10(a) rebuild V0/V3 from authors' public KS3 fit activations and compare
outputs: [research/reproduction/phase6a_reproduction_gap_analysis.md, research/reproduction/experiments/phase6a_reproduction_gap_analysis.yaml]
