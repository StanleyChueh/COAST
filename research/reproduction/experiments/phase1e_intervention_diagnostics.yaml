  definitions:
    delta: "h_steered - h, per token, float32 from the (bf16) tensors the model sees"
    mean_delta_norm: "mean over tokens of ||delta||_2"
    max_delta_norm: "max over tokens of ||delta||_2"
    mean_relative_delta: "mean over tokens of ||delta|| / ||h||"
    max_relative_delta: "max over tokens of ||delta|| / ||h||"
    mean_hidden_norm: "mean over tokens of ||h||"
    mean_cosine_delta_hidden: "mean over tokens of cos(delta, h); -1 = pure shrink along h (added beyond the required fields)"
