interpretation:  # bounded to this configuration
  - "At L5/beta=0.1 with the V0 conceptor, removing C and keeping only the ~10% contraction left 14/15 episode outcomes unchanged; no detectable behavioral contribution of C beyond scaling except one unattributable state."
  - "Consistent with Phase 1E (cos(delta,h) = -0.9996) and with Phases 1C/1D showing no V0/V3 behavioral difference."
  - "Does not show conceptor directions are useless in general: this C is small (lambda_max 0.35) and beta is small; other layers/betas/tasks untested by design."
  - "All counts (13/11/10) lie within the baseline noise-seed spread (7-13) from Phase 1D; no pairwise difference is statistically distinguishable at N=15."

