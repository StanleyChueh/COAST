difference_analysis:
- selected fit maxima are consistent with no configuration effect (winner's curse); fit-to-test drops 0.17-0.23
- only structured grid effect is harm at beta 0.5 (global, per_step); positive_only fit scores under-dispersed
- test states do not separate steered from unsteered (our unsteered range 17-21/30)
- paper-selected configs are mid-ranked on our fit states
- 'unresolved causes: unknown paper states/seeds, paper selection noise, V0 vs V3 builder, code version (PR48, per-step alpha axis absent), per-step alpha 1 vs 10,
  env/checkpoint versions, run-level non-determinism'
limitations: [one unseeded unpaired run per test condition (SD ~0.09), single 15-episode draw per fit configuration, test states reused from Phases 4A/5A, fit states
    are both conceptor data and selection data, linear interrupted and excluded, per_step restricted to alpha 1.0, fit baselines over-dispersed]
tool_fix: 'analyze_phase5c_oracle.py cmd_test: summary dict aliased the CSV row (extra keys broke DictWriter); now copies the row; no result affected'
not_done_by_design: [tuning beyond paper grid, source changes, V3 builder arm, per-step alpha axis, other LIBERO tasks, contacting authors, commit/push]
