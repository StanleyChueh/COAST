    grid_global_positive_only: {paper: 4x5x3 each, ours: 60 + 60, confidence: high, impact: none}
    per_step_alpha: {paper: KS3 alpha 10, ours: fixed 1.0, confidence: low (known gap), impact: per-step column only}
    released_best_configs: {paper: README says committed, ours: empty placeholder, confidence: low, impact: would show authors' selections}
  policy_randomness:
