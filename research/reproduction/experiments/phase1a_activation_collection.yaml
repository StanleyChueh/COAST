notes:
  - "Validation only. The 8/15 success rate is a byproduct of collection, not an evaluation result."
  - "Init states 0-14 form the official collection window; future sweeps/evals must use disjoint windows (e.g. seed 15 / seed 30)."
  - "Failures are all timeouts, so the failure class contributes 1.9x more inference steps than the success class."
  - "The activation collector and COAST algorithm were not modified. No conceptors, R matrices, steering, or sweeps were computed."
  - "boolean_and was checked only on synthetic random matrices (no collected data used) to confirm D3 below."
  - "Activation NPZs live under activations/ (gitignored); client videos/logs under examples/libero_env/output/ (gitignored)."

paper_vs_code_differences:
  - id: D1_token_pooling
    paper: "Mean-pool across action tokens: one vector per denoising step (Sec. 3.2, A.9.1)."
    code: "Collection stores token-level states. conceptors.py flatten_global/flatten_per_step use every token as a separate row (no pooling)."
    consequence: "10x more rows; covariance includes between-token variance; different conceptor subspaces."
  - id: D2_centering
    paper: "Mean-center X before R (Eq. 1, A.9.1)."
    code: "conceptors.correlation_matrix computes the uncentered R = X^T X / N. Collection stores raw uncentered activations (L11 ||mean|| ~133 vs mean row norm ~203)."
    consequence: "A dominant shared-mean rank-1 term in R_success and R_failure changes the conceptor spectra and AND-NOT results."
  - id: D3_boolean_and
    paper: "C_s AND NOT C_f = (C_s^-1 + (I - C_f)^-1 - I)^-1 via pinv; symmetric PSD."
    code: "boolean_and(A,B) = A @ inv(A + B - A@B) @ B. It equals canonical only if A and B commute (canonical = A @ inv(A + B - B@A) @ B)."
    consequence: "Synthetic check: 13.7% relative difference and a non-symmetric result for non-commuting conceptors, so the steering operator differs from the paper's."
  - id: D4_suffix_tokens
    paper: "Suffix tokens = proprioceptive state + noised action chunk (A.7.1)."
    code: "pi0.5 suffix = 10 action tokens only; state token only for pi0."
    consequence: "S = 10; affects token-index interpretation only."
  - id: D5_mlp_terminology
    paper: "MLP hidden = post-GELU activation (A.7.1)."
    code: "Input to down_proj = gelu_tanh(gate_proj(x)) * up_proj(x) (GeGLU)."
    consequence: "Terminology only."
  - id: D6_min_class_size
    paper: "Tasks with <3 successes or <3 failures are excluded (A.8.3)."
    code: "compute_conceptors.py defaults min_episodes_per_class=2; compute_all_conceptors() skips a task when either class has fewer episodes than that threshold."
    difference: "paper threshold 3 vs repository default threshold 2"
    consequence: "Tasks with exactly 2 episodes of a class are kept by the repository but excluded by the paper; not triggered here (8/7)."
    correction: "Corrected in Phase 1B review; the earlier text wrongly said the builder skips only an empty class."
  - id: D7_class_sample_imbalance
    paper: "Not specified."
    code: "No per-episode weighting; failure timeouts contribute 728 vs 385 success inference steps."
    consequence: "C_failure is weighted toward long stalled failure trajectories."
